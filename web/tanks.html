<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0d1310">
<title>Танки</title>
<style>
:root{--acc:#9be04a;--acc2:#ffd23a;--fg:#e9f0e2;--bg:#0d1310;--pn:rgba(14,22,16,.93)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:15px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;touch-action:none;overscroll-behavior:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#h{pointer-events:none}
#menu{position:fixed;inset:0;z-index:10;display:flex;pointer-events:none}
#menu .stage{flex:1;position:relative;pointer-events:none}
#menu .logo{position:absolute;left:18px;top:calc(env(safe-area-inset-top,0px) + 12px);font-size:34px;font-weight:900;letter-spacing:.12em;color:var(--acc);text-shadow:0 0 18px rgba(150,230,70,.35),0 3px 0 #23400d}
#menu .logo small{display:block;font-size:12px;letter-spacing:.06em;color:#b9c9ad;font-weight:600;text-shadow:none}
#menu .pv{position:absolute;left:18px;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);right:18px;font-size:13px;color:#cfdcc4;text-shadow:0 1px 3px #000}
#menu .pv b{color:#fff;font-size:17px}
#panel{width:min(420px,48vw);height:100%;overflow:auto;background:var(--pn);border-left:1px solid rgba(155,224,74,.18);padding:14px 14px calc(env(safe-area-inset-bottom,0px) + 16px);display:flex;flex-direction:column;gap:10px;pointer-events:auto}
@media (orientation:portrait){#menu{flex-direction:column}#menu .stage{flex:0 0 38%}#panel{width:100%;height:62%;border-left:0;border-top:1px solid rgba(155,224,74,.18)}}
.room{font-size:13px;color:#b9c9ad}.room b{color:#fff}
.st{font-size:13px;color:var(--acc2);min-height:1.2em}
.tabs{display:flex;gap:6px}
.tabs button{flex:1;font:inherit;font-weight:700;border:0;border-radius:10px;padding:9px 4px;font-size:13px;background:rgba(255,255,255,.07);color:#cfdcc4;cursor:pointer}
.tabs button.on{background:var(--acc);color:#14230a}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.it{border-radius:12px;padding:9px 8px;background:rgba(255,255,255,.06);border:2px solid transparent;cursor:pointer;text-align:center;font-size:13px;font-weight:700;display:flex;flex-direction:column;gap:4px;align-items:center}
.it.on{border-color:var(--acc);background:rgba(155,224,74,.12)}
.it .sw{width:52px;height:32px;border-radius:7px;border:1px solid rgba(255,255,255,.25);background-size:cover}
.it .ic{font-size:22px;line-height:1}
.it small{font-weight:500;color:#9fb092;font-size:11px}
.info{background:rgba(0,0,0,.28);border-radius:12px;padding:10px 12px;font-size:13px;color:#cfdcc4;display:flex;flex-direction:column;gap:5px}
.info b{color:#fff;font-size:15px}
.bar{display:flex;align-items:center;gap:8px;font-size:12px}
.bar span{width:92px;color:#9fb092}
.bar i{flex:1;height:7px;border-radius:4px;background:rgba(255,255,255,.1);position:relative;overflow:hidden}
.bar i u{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#6fbf2a,#c9f06a)}
.note{font-size:12px;color:var(--acc2)}
#panel>button,.row button{font:inherit;font-weight:800;letter-spacing:.06em;border:0;border-radius:12px;padding:13px 16px;cursor:pointer;background:var(--acc);color:#14230a;font-size:17px}
#panel button.sec,.row button{background:rgba(255,255,255,.09);color:var(--fg);font-weight:600;font-size:14px;letter-spacing:0;padding:11px 12px}
#panel button:disabled{opacity:.45}
.row{display:flex;gap:8px}.row button{flex:1}
label{display:flex;align-items:center;gap:10px;font-size:13px;color:#b9c9ad}
input[type=range]{flex:1;accent-color:var(--acc)}
.help{font-size:12px;color:#a9b99c;background:rgba(0,0,0,.25);border-radius:12px;padding:9px 12px;line-height:1.6}
.help b{color:#fff}
#rooms{position:fixed;inset:0;z-index:15;background:rgba(5,9,6,.86);display:none;align-items:center;justify-content:center;padding:16px}
#rooms .box{width:min(440px,100%);max-height:100%;overflow:auto;background:#121c15;border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px}
#rooms .rm{padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.05)}
#rooms .rm b{display:block;color:#fff}#rooms .rm small{color:#9fb092}
#rooms .rm.on{outline:2px solid var(--acc)}
#tc{position:fixed;inset:0;z-index:5;display:none}
#tc.on{display:block}
#js{position:absolute;width:130px;height:130px;border-radius:50%;border:2px solid rgba(255,255,255,.25);background:rgba(255,255,255,.06);display:none;transform:translate(-50%,-50%)}
#js i{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px;border-radius:50%;background:rgba(155,224,74,.45)}
.tb{position:absolute;border-radius:50%;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.25);color:#fff;font-weight:800;display:grid;place-items:center;font-size:13px;letter-spacing:.04em}
.tb.on{background:rgba(155,224,74,.45)}
#bFire{right:calc(env(safe-area-inset-right,0px) + 28px);bottom:calc(env(safe-area-inset-bottom,0px) + 40px);width:96px;height:96px;font-size:15px}
#bCenter{right:calc(env(safe-area-inset-right,0px) + 46px);bottom:calc(env(safe-area-inset-bottom,0px) + 150px);width:56px;height:56px;font-size:22px}
#bTL,#bTR{bottom:calc(env(safe-area-inset-bottom,0px) + 30px);width:74px;height:74px;font-size:26px}
#bTR{right:calc(env(safe-area-inset-right,0px) + 136px)}#bTL{right:calc(env(safe-area-inset-right,0px) + 220px)}
#sup{position:fixed;z-index:6;left:calc(env(safe-area-inset-left,0px) + 14px);bottom:calc(env(safe-area-inset-bottom,0px) + 16px);display:none;gap:6px}
#sup button{position:relative;width:48px;height:48px;border-radius:10px;border:2px solid rgba(255,255,255,.28);background:rgba(10,16,10,.7);color:#fff;font:inherit;padding:0;cursor:pointer;touch-action:none}
#sup button span{font-size:19px;line-height:44px}#sup button b{position:absolute;right:3px;bottom:1px;font-size:11px}#sup button em{position:absolute;left:4px;top:1px;font-size:10px;font-style:normal;color:#9fb092}
#sup button i{position:absolute;inset:0;display:grid;place-items:center;font-style:normal;font-weight:900;font-size:16px;color:#ffd23a;text-shadow:0 1px 3px #000}
#sup button.off{opacity:.55}#sup button.off i:not(:empty){background:rgba(0,0,0,.45);border-radius:8px}
html.touch #sup{bottom:auto;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 64px)}html.touch #sup button{width:44px;height:44px}html.touch #sup button span{line-height:40px}
#bScore{left:calc(env(safe-area-inset-left,0px) + 14px);top:calc(env(safe-area-inset-top,0px) + 58px);width:44px;height:44px;font-size:17px}
#bMenu{right:calc(env(safe-area-inset-right,0px) + 14px);top:calc(env(safe-area-inset-top,0px) + 12px);width:auto;height:40px;padding:0 14px;border-radius:12px;font-size:13px}
.prof{display:flex;align-items:center;gap:10px;background:rgba(0,0,0,.3);border-radius:12px;padding:8px 10px}
.prof img{width:40px;height:40px}
.prof .pn{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;font-size:13px}
.prof .pn b{color:#fff;font-size:14px}.prof .pn small{color:#9fb092;font-size:11px}
.prof .xp{height:5px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden}.prof .xp i{display:block;height:100%;background:#ffd23a}
.prof .cr{font-weight:800;color:#fff;font-size:15px;white-space:nowrap}
.it.no{opacity:.72}
.mods{display:flex;gap:5px;margin:2px 0}.mods span{font-size:11px;font-weight:800;padding:3px 9px;border-radius:6px;background:rgba(255,255,255,.08);color:#7d8b74;cursor:pointer}.mods span.on{background:#9be04a;color:#14230a}.mods span.cur{outline:2px solid #ffd23a}
.bar em{width:104px;text-align:right;font-style:normal;color:#e9f0e2;font-size:11px}
.acts{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.acts button{font:inherit;font-weight:800;border:0;border-radius:10px;padding:10px;cursor:pointer;background:var(--acc);color:#14230a;font-size:14px}
.acts button.sec{background:rgba(255,210,58,.9);color:#2a2005}
.acts button:disabled{opacity:.5;cursor:default;background:rgba(255,255,255,.12);color:#cfdcc4}
.rmb{display:flex;gap:6px;margin-top:6px}.rmb button{flex:1;font:inherit;font-size:13px;font-weight:700;border:0;border-radius:10px;padding:9px 6px;background:rgba(255,255,255,.08);color:#fff;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.rmb button small{font-weight:500;color:#9fb092;font-size:11px}.rmb button.on{outline:2px solid var(--acc)}
#err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:24px;text-align:center;z-index:20;background:var(--bg)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<canvas id="h"></canvas>
<div id="tc"><div id="js"><i></i></div><div class="tb" id="bFire">ОГОНЬ</div><div class="tb" id="bTL">◀</div><div class="tb" id="bTR">▶</div><div class="tb" id="bCenter">◎</div><div class="tb" id="bScore">☰</div><div class="tb" id="bMenu">ГАРАЖ</div></div>
<div id="sup"></div>
<div id="menu">
  <div class="stage"><div class="logo">ТАНКИ<small>онлайн-битвы · ОлеговщинаСМС</small></div><div class="pv" id="pv"></div></div>
  <div id="panel">
    <div class="prof" id="prof"></div>
    <div class="room" id="room"></div>
    <div class="st" id="mst">Подключение к серверу…</div>
    <div class="tabs"><button data-tab="h" class="on">Корпус</button><button data-tab="u">Пушка</button><button data-tab="c">Краска</button><button data-tab="s">Припасы</button></div>
    <div class="list" id="list"></div>
    <div class="info" id="info"></div>
    <div class="note" id="eqnote"></div>
    <button id="play" disabled>В БОЙ</button>
    <div class="row"><button id="sd">Самоуничтожение</button><button id="rb">Сменить битву</button></div>
    <label>Наклон камеры <input type="range" id="sens" min="0.3" max="3" step="0.05"></label>
    <div class="help" id="help"></div>
    <button class="sec" id="exit">← Выйти в мессенджер</button>
  </div>
</div>
<div id="rooms"><div class="box"><b>Выберите битву</b><div id="rlist">Загрузка…</div><button class="sec" id="rclose" style="font:inherit;border:0;border-radius:12px;padding:11px;background:rgba(255,255,255,.09);color:#fff">Закрыть</button></div></div>
<div id="err"></div>
<script>
'use strict';
/* Танки — онлайн-бои на танках. Чистый WebGL; урон, счёт и матчи считает сервер мессенджера. */
const $=s=>document.querySelector(s);
const LS='shepot.v1';
let SES=null;try{SES=JSON.parse(localStorage.getItem(LS)||'null')}catch(e){}
if(!SES||!SES.token)location.replace('/');
const coarse=matchMedia('(pointer:coarse)').matches||navigator.maxTouchPoints>0||'ontouchstart' in window;
if(coarse)document.documentElement.classList.add('touch');
const cv=$('#c'),hud=$('#h'),hx=hud.getContext('2d');
const gl=cv.getContext('webgl',{antialias:!coarse,alpha:false,powerPreference:'high-performance'});
function fatal(t){const e=$('#err');e.style.display='flex';e.innerHTML=t}
if(!gl)fatal('Браузер не поддерживает WebGL. Обновите браузер или включите аппаратное ускорение.');
const lsGet=(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:v}catch(e){return d}},lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};

/* ---------- математика ---------- */
const M4=()=>{const m=new Float32Array(16);m[0]=m[5]=m[10]=m[15]=1;return m};
function mul(a,b){const o=new Float32Array(16);for(let c=0;c<4;c++)for(let r=0;r<4;r++)o[c*4+r]=a[r]*b[c*4]+a[4+r]*b[c*4+1]+a[8+r]*b[c*4+2]+a[12+r]*b[c*4+3];return o}
function persp(fy,as,n,f){const m=new Float32Array(16),t=1/Math.tan(fy/2);m[0]=t/as;m[5]=t;m[10]=(f+n)/(n-f);m[11]=-1;m[14]=2*f*n/(n-f);return m}
function T(m,x,y,z){for(let i=0;i<4;i++)m[12+i]+=m[i]*x+m[4+i]*y+m[8+i]*z;return m}
function RY(m,a){const c=Math.cos(a),s=Math.sin(a);for(let i=0;i<4;i++){const x=m[i],z=m[8+i];m[i]=x*c-z*s;m[8+i]=x*s+z*c}return m}
function RX(m,a){const c=Math.cos(a),s=Math.sin(a);for(let i=0;i<4;i++){const y=m[4+i],z=m[8+i];m[4+i]=y*c+z*s;m[8+i]=-y*s+z*c}return m}
function RZ(m,a){const c=Math.cos(a),s=Math.sin(a);for(let i=0;i<4;i++){const x=m[i],y=m[4+i];m[i]=x*c+y*s;m[4+i]=-x*s+y*c}return m}
function SC(m,x,y,z){for(let i=0;i<4;i++){m[i]*=x;m[4+i]*=y;m[8+i]*=z}return m}
const sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]],add=(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]],scl=(a,s)=>[a[0]*s,a[1]*s,a[2]*s];
const dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2],len=a=>Math.hypot(a[0],a[1],a[2]),nrm=a=>{const l=len(a)||1;return[a[0]/l,a[1]/l,a[2]/l]};
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
const lerp=(a,b,t)=>a+(b-a)*t,clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const wrap=a=>{while(a>Math.PI)a-=2*Math.PI;while(a<-Math.PI)a+=2*Math.PI;return a};
const angLerp=(a,b,t)=>a+wrap(b-a)*t;
const fwd=y=>[-Math.sin(y),0,-Math.cos(y)];
const hex=h=>{const n=parseInt(h.slice(1),16);return[(n>>16&255)/255,(n>>8&255)/255,(n&255)/255]};

/* ---------- шейдер ---------- */
const VS=`attribute vec3 aP;attribute vec3 aN;attribute vec2 aT;attribute vec3 aC;
uniform mat4 uVP;uniform mat4 uM;uniform vec2 uScroll;
varying vec3 vW;varying vec3 vN;varying vec3 vC;varying vec2 vT;
void main(){vec4 w=uM*vec4(aP,1.0);vW=w.xyz;vN=(uM*vec4(aN,0.0)).xyz;vC=aC;vT=aT+uScroll;gl_Position=uVP*w;}`;
const FS=`precision mediump float;
uniform sampler2D uTex;uniform vec4 uTint;uniform float uEm;uniform vec3 uCam;uniform vec3 uFogC;uniform float uFogD;
uniform vec4 uLP[4];uniform vec3 uLC[4];uniform float uSky;uniform vec3 uZen;uniform vec3 uSunD;uniform float uSunK;uniform float uDyn;uniform vec3 uAmb;uniform vec3 uSunC;
varying vec3 vW;varying vec3 vN;varying vec3 vC;varying vec2 vT;
void main(){if(uSky>0.5){vec3 d=normalize(vW-uCam);vec3 c=mix(uFogC,uZen,clamp(d.y*1.8,0.0,1.0));float s=max(dot(d,-uSunD),0.0);c+=vec3(1.0,0.92,0.75)*(pow(s,500.0)*2.0+pow(s,10.0)*0.22)*uSunK;gl_FragColor=vec4(c,1.0);return;}
vec4 t=texture2D(uTex,vT)*uTint;vec3 n=normalize(vN);vec3 l=vC;
if(uDyn>0.5){l=uAmb+uSunC*max(0.0,dot(n,-uSunD))+vec3(0.06)*max(0.0,n.y);l*=vC;}
for(int i=0;i<4;i++){float r=uLP[i].w;if(r>0.0){vec3 d=uLP[i].xyz-vW;float ds=length(d);float a=max(0.0,1.0-ds/r);l+=uLC[i]*a*a*(0.35+0.65*max(0.0,dot(n,d/max(ds,0.001))));}}
vec3 c=mix(t.rgb*l,t.rgb,uEm);float dz=length(vW-uCam)*uFogD;float f=1.0-exp(-dz*dz);
gl_FragColor=vec4(mix(c,uFogC,clamp(f,0.0,0.85)),t.a);}`;
let prog,A={},U={};
function initGL(){
  const sh=(t,s)=>{const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(o));return o};
  prog=gl.createProgram();gl.attachShader(prog,sh(gl.VERTEX_SHADER,VS));gl.attachShader(prog,sh(gl.FRAGMENT_SHADER,FS));gl.linkProgram(prog);
  if(!gl.getProgramParameter(prog,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(prog));
  gl.useProgram(prog);
  for(const a of['aP','aN','aT','aC']){A[a]=gl.getAttribLocation(prog,a);gl.enableVertexAttribArray(A[a])}
  for(const u of['uVP','uM','uScroll','uTex','uTint','uEm','uCam','uFogC','uFogD','uSky','uZen','uSunD','uSunK','uDyn','uAmb','uSunC'])U[u]=gl.getUniformLocation(prog,u);
  U.LP=[0,1,2,3].map(i=>gl.getUniformLocation(prog,`uLP[${i}]`));U.LC=[0,1,2,3].map(i=>gl.getUniformLocation(prog,`uLC[${i}]`));
}
function mesh(arr){const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(arr),gl.STATIC_DRAW);return{b,n:arr.length/11}}
function bindMesh(m){gl.bindBuffer(gl.ARRAY_BUFFER,m.b);gl.vertexAttribPointer(A.aP,3,gl.FLOAT,false,44,0);gl.vertexAttribPointer(A.aN,3,gl.FLOAT,false,44,12);gl.vertexAttribPointer(A.aT,2,gl.FLOAT,false,44,24);gl.vertexAttribPointer(A.aC,3,gl.FLOAT,false,44,32)}

/* ---------- процедурные текстуры ---------- */
let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
function grain(x,s,a){const d=x.getImageData(0,0,s,s),p=d.data;for(let i=0;i<p.length;i+=4){const n=(rnd()-.5)*a;p[i]+=n;p[i+1]+=n;p[i+2]+=n}x.putImageData(d,0,0)}
function shade(c,k){const v=hex(c).map(x=>Math.round(clamp(x*k,0,1)*255));return`rgb(${v})`}
const TX={},TXP=[],PCAN=[];
function upTex(c){const t=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,t);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,c);gl.generateMipmap(gl.TEXTURE_2D);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.REPEAT);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.REPEAT);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR_MIPMAP_LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.NEAREST);
  const an=gl.getExtension('EXT_texture_filter_anisotropic');if(an)gl.texParameterf(gl.TEXTURE_2D,an.TEXTURE_MAX_ANISOTROPY_EXT,4);return t}
function canv(draw,size=64){const c=document.createElement('canvas');c.width=c.height=size;draw(c.getContext('2d'),size);return c}
function mkTex(name,draw,size=64){TX[name]=upTex(canv(draw,size))}
function blocks(x,s,base,rows,cols,var_){for(let r=0;r<rows;r++)for(let c=-1;c<=cols;c++){const w=s/cols,h=s/rows,o=r%2?w/2:0;x.fillStyle=shade(base,1-var_/2+rnd()*var_);x.fillRect(c*w+o+1,r*h+1,w-2,h-2)}}
function makeTextures(){
  mkTex('white',(x,s)=>{x.fillStyle='#fff';x.fillRect(0,0,s,s);grain(x,s,18)},16);
  mkTex('sand',(x,s)=>{x.fillStyle='#cdb68a';x.fillRect(0,0,s,s);for(let k=0;k<120;k++){x.fillStyle=rnd()<.5?'#b89f72':'#dcc79c';x.fillRect(rnd()*s,rnd()*s,1+rnd()*3,1+rnd()*2)}grain(x,s,22)});
  mkTex('conc',(x,s)=>{x.fillStyle='#8f9190';x.fillRect(0,0,s,s);for(let i=0;i<2;i++)for(let j=0;j<2;j++){x.fillStyle=shade('#a2a4a2',.9+rnd()*.18);x.fillRect(i*32+1,j*32+1,30,30)}
    for(let k=0;k<20;k++){x.fillStyle='rgba(60,60,60,.18)';x.beginPath();x.arc(rnd()*s,rnd()*s,1+rnd()*3,0,7);x.fill()}grain(x,s,18)});

  else if(tab==='s')L.innerHTML=CAT.sn.map((n,i)=>cardHTML('s',i,n,`<div class="ic" style="color:${['#7dff6a','#ffd23a','#ff5a4a','#5ab0ff','#ff9a3a'][i]}">${SUPI[i]}</div>`)).join('');
  else L.innerHTML=PAINTS.map((p,i)=>cardHTML('c',i,p[0],`<div class="sw" style="background-image:url(${PCAN[i]?PCAN[i].toDataURL():''})"></div>`)).join('');
  const k=tab,i=PV[k],bars=a=>a.map(([n,v,t])=>`<div class="bar"><span>${n}</span><i><u style="width:${Math.round(clamp(v,0,1)*100)}%"></u></i><em>${t}</em></div>`).join('');
  let html='',acts='';const own=owned(k,i);
  if(k==='c'){const[prc,rk]=CAT.ps[i]||[0,0];html=`<b>Краска «${PAINTS[i][0]}»</b>Меняет только внешний вид танка, видна всем в бою.`;
    acts=own?(PROF.eq[2]===i?'<button disabled>Установлена</button>':'<button data-act="eq">Установить</button>'):PROF.rank<rk?`<button disabled>Нужно звание «${CAT.ranks[rk]}»</button>`:`<button data-act="buy" ${PROF.cr<prc?'disabled':''}>Купить за 💎 ${fmt(prc)}</button>`}
  else if(k==='s'){const pr1=CAT.sp[i];html=`<b>${CAT.sn[i]}</b>${SUPD[i]}<br>В бою — клавиша <b>${i+1}</b> или кнопка внизу экрана. Есть: <b>${fmt((PROF.sup||[])[i]||0)}</b>`;
    acts=[1,10,100].map(n=>`<button data-act="buy" data-n="${n}" ${PROF.cr<pr1*n?'disabled':''}>Купить ${n} за 💎 ${fmt(pr1*n)}</button>`).join('')}
  else{const m0=own?PROF[k][i]:0,m=PVM==null?m0:PVM,sh=shopOf(k,i);
    const mods=[0,1,2,3].map(j=>`<span class="${own&&j<=m0?'on':''} ${j===m?'cur':''}" data-m="${j}">M${j}</span>`).join('');
    const ttl=`<b>${sh.n} M${m}</b>${sh.ds||''}<div class="mods">${mods}</div>`;
    if(k==='h')html=ttl+bars(hullStats(sh,m));else{const[Ls,x]=turStats(sh,m);html=ttl+bars(Ls)+(x.length?`<small>${x.join('<br>')}</small>`:'')}
    const eqd=PROF.eq[k==='h'?0:1]===i;
    if(!own)acts=PROF.rank<sh.rk[0]?`<button disabled>Нужно звание «${CAT.ranks[sh.rk[0]]}»</button>`:`<button data-act="buy" ${PROF.cr<sh.pr[0]?'disabled':''}>Купить M0 за 💎 ${fmt(sh.pr[0])}</button>`;
    else{acts=eqd?'<button disabled>Установлено</button>':'<button data-act="eq">Установить</button>';
      if(m0<3)acts+=PROF.rank<sh.rk[m0+1]?`<button class="sec" disabled>M${m0+1}: нужно звание «${CAT.ranks[sh.rk[m0+1]]}»</button>`:`<button class="sec" data-act="buy" ${PROF.cr<sh.pr[m0+1]?'disabled':''}>Улучшить до M${m0+1} за 💎 ${fmt(sh.pr[m0+1])}</button>`;
      else acts+='<button class="sec" disabled>Максимальная модификация M3</button>'}}
  $('#info').innerHTML=html+`<div class="acts">${acts}</div>`;
  const h=HU[PV.h]||HU[0],t=TU[PV.u]||TU[0];$('#pv').innerHTML=`<b>${h.n} + ${t.n}</b><br>краска «${PAINTS[PV.c][0]}»${owned('h',PV.h)&&owned('u',PV.u)&&owned('c',PV.c)?'':' · <span style="color:#ffd23a">предпросмотр</span>'}`;
  renderNote()}
function renderNote(){const n=$('#eqnote');if(!n)return;n.textContent=P.alive&&(PROF.eq[0]!==ME.h||PROF.eq[1]!==ME.u)?'Новый корпус или пушка появятся после возрождения. Можно сразу нажать «Самоуничтожение».':''}
$('#list').onclick=e=>{const it=e.target.closest('.it');if(!it)return;PV[tab]=+it.dataset.i;PVM=null;initAudio();snd('click');renderGarage()};
$('#info').onclick=e=>{const mm=e.target.closest('[data-m]');if(mm){PVM=+mm.dataset.m;snd('click');renderGarage();return}
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const i=PV[tab];
  if(b.dataset.act==='buy'){sendWS({t:'buy',k:tab,i,n:+(b.dataset.n||1)});PVM=null}
  else{const eq=PROF.eq.slice();eq[{h:0,u:1,c:2}[tab]]=i;sendWS({t:'eq',h:eq[0],u:eq[1],pt:eq[2]})}};
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;PVM=null;renderGarage()});
$('#sd').onclick=()=>{sendWS({t:'sd'});hideMenu()};
const MODEN={dm:'Каждый сам за себя',tdm:'Команда на команду',ctf:'Захват флага',cp:'Контроль точек'};
$('#rb').onclick=async()=>{$('#rooms').style.display='flex';try{const r=await fetch('/api/tanks/info',{headers:{Authorization:'Bearer '+SES.token}}).then(r=>r.json());const by={};for(const x of r.rooms)(by[x.map]=by[x.map]||[]).push(x);
  $('#rlist').innerHTML=Object.entries(by).map(([mp,l])=>`<div class="rm"><b>${mp}</b><div class="rmb">${l.map(x=>`<button data-r="${x.id}" class="${x.id===ROOM?'on':''}">${MODEN[x.mode]}<small>${x.players.length?'в бою: '+x.players.length:'пусто'}${x.id===ROOM?' · вы здесь':''}</small></button>`).join('')}</div></div>`).join('')}catch(e){$('#rlist').textContent='Не удалось загрузить список'}};
$('#rlist').onclick=e=>{const r=e.target.closest('[data-r]');if(r&&r.dataset.r!==ROOM){try{ws&&ws.close()}catch(_){}location.href='/tanks?room='+r.dataset.r}};
$('#rclose').onclick=()=>{$('#rooms').style.display='none'};

/* ---------- управление ---------- */
// Как в «Танках Онлайн»: W/S — ход, A/D — поворот корпуса, Z/X или стрелки ← → — плавный поворот башни, C — башню прямо, пробел — огонь, 1–5 — припасы
let sens=+lsGet('tanks.sens',1);$('#sens').value=sens;$('#sens').oninput=e=>{sens=+e.target.value;lsSet('tanks.sens',sens)};
function look(dx,dy,k){if(!scoping)camAng=clamp(camAng+dy*k*sens*.6,.06,1)}
function showMenu(){menuOpen=true;hx.clearRect(0,0,W,H_);endScope();vulcanOff();$('#menu').style.display='flex';$('#tc').classList.remove('on');$('#sup').style.display='none';firing=false;tbL=tbR=false;for(const k in K)K[k]=false;mvx=mvy=0;renderGarage()}
function hideMenu(){menuOpen=false;$('#menu').style.display='none';$('#rooms').style.display='none';if(coarse)$('#tc').classList.add('on')}
function helpText(){$('#help').innerHTML=coarse?'<b>Джойстик</b> слева — ход и поворот корпуса · <b>◀ ▶</b> — поворот башни · <b>◎</b> — башню прямо<br><b>ОГОНЬ</b> — стрелять (Шафт: держать — прицел, Вулкан: держать — раскрутка) · кнопки <b>припасов</b> вверху · <b>☰</b> — счёт':
 '<b>W/S</b> или <b>↑ ↓</b> — газ и задний ход · <b>A/D</b> — поворот корпуса<br><b>← →</b> — поворот башни · <b>C</b> — башню прямо<br><b>Пробел</b> — огонь (Шафт: держать — прицел, ← → и ↑ ↓ — наводка) · <b>1–5</b> — припасы · <b>Tab</b> — счёт · <b>Esc</b> — гараж'}
helpText();
$('#play').onclick=()=>{initAudio();if(AC&&AC.state==='suspended')AC.resume();hideMenu();
  if(coarse){try{document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen().catch(()=>{});screen.orientation&&screen.orientation.lock&&screen.orientation.lock('landscape').catch(()=>{})}catch(e){}}};
$('#exit').onclick=()=>{try{ws&&ws.close()}catch(e){}location.href='/'};
document.addEventListener('contextmenu',e=>e.preventDefault());
const GAMEKEYS=new Set(['Space','Tab','ArrowUp','ArrowDown','ArrowLeft','ArrowRight']);
document.addEventListener('keydown',e=>{if(menuOpen){if(e.code==='Escape'&&P.alive&&ready&&connected)hideMenu();return}K[e.code]=true;if(GAMEKEYS.has(e.code))e.preventDefault();
  if(e.code==='Space')firing=true;if(e.code==='Tab')showScores=true;if(e.code==='Escape')showMenu();
  const d=/^Digit([1-5])$/.exec(e.code)||/^Numpad([1-5])$/.exec(e.code);if(d&&!e.repeat)useSup(+d[1]-1)});
document.addEventListener('keyup',e=>{K[e.code]=false;if(e.code==='Space')firing=false;if(e.code==='Tab')showScores=false});
addEventListener('blur',()=>{for(const k in K)K[k]=false;firing=false;tbL=tbR=false});
document.addEventListener('visibilitychange',()=>{if(document.hidden){for(const k in K)K[k]=false;firing=false;tbL=tbR=false}});
function useSup(i){if(!P.alive||overRes)return;const n=(PROF.sup||[])[i]||0;if(n<=0){msg('Нет припаса «'+CAT.sn[i]+'» — купите в гараже');return}
  if(cdLeft(i)>0||(i>=1&&i<=3&&fxLeft(i-1)>0))return;sendWS({t:'sup',i})}
$('#sup').innerHTML=[0,1,2,3,4].map(i=>`<button data-s="${i}"><span>${SUPI[i]}</span><b>0</b><i></i><em>${i+1}</em></button>`).join('');
$('#sup').addEventListener('click',e=>{const b=e.target.closest('[data-s]');if(b)useSup(+b.dataset.s)});
$('#sup').addEventListener('touchstart',e=>{const b=e.target.closest('[data-s]');e.preventDefault();e.stopPropagation();if(b)useSup(+b.dataset.s)},{passive:false});
const TC={mv:null,lk:null,fire:null};const js=$('#js'),knob=js.querySelector('i');
const onBtn=(id,down,up)=>{const b=$(id),on=e=>{b.classList.add('on');down(e)},off=e=>{if(!b.classList.contains('on'))return;b.classList.remove('on');up&&up(e)};
  b.addEventListener('touchstart',e=>{e.preventDefault();e.stopPropagation();on(e)},{passive:false});
  b.addEventListener('touchend',e=>{e.preventDefault();e.stopPropagation();off(e)},{passive:false});b.addEventListener('touchcancel',off);
  b.addEventListener('mousedown',e=>{e.preventDefault();on(e)});b.addEventListener('mouseup',off);b.addEventListener('mouseleave',off)};
onBtn('#bFire',()=>{initAudio();firing=true},()=>{firing=false});
onBtn('#bTL',()=>{tbL=true;P.center=false},()=>{tbL=false});onBtn('#bTR',()=>{tbR=true;P.center=false},()=>{tbR=false});
onBtn('#bCenter',()=>{P.center=true});onBtn('#bScore',()=>{showScores=!showScores});onBtn('#bMenu',()=>{showMenu();try{document.exitFullscreen&&document.fullscreenElement&&document.exitFullscreen()}catch(e){}});
$('#tc').addEventListener('touchstart',e=>{e.preventDefault();initAudio();for(const t of e.changedTouches){if(t.clientX<W*.45&&!TC.mv){TC.mv={id:t.identifier,x:t.clientX,y:t.clientY};js.style.display='block';js.style.left=t.clientX+'px';js.style.top=t.clientY+'px';knob.style.transform=''}
  else if(!TC.lk)TC.lk={id:t.identifier,x:t.clientX,y:t.clientY}}},{passive:false});
document.addEventListener('touchmove',e=>{if(menuOpen)return;e.preventDefault();for(const t of e.changedTouches){
  if(TC.mv&&t.identifier===TC.mv.id){let dx=t.clientX-TC.mv.x,dy=t.clientY-TC.mv.y;const l=Math.hypot(dx,dy),R=55;if(l>R){dx*=R/l;dy*=R/l}knob.style.transform=`translate(${dx}px,${dy}px)`;mvx=dx/R;mvy=dy/R}
  if(TC.lk&&t.identifier===TC.lk.id){look(t.clientX-TC.lk.x,t.clientY-TC.lk.y,.0065);TC.lk.x=t.clientX;TC.lk.y=t.clientY}}},{passive:false});
// кнопка отпускается, если на ней не осталось пальца (даже если событие касания потерялось)
const BTNS=[['#bTL',()=>{tbL=false}],['#bTR',()=>{tbR=false}],['#bFire',()=>{firing=false}]];
function syncBtns(e){const held=new Set();for(const t of e.touches){const b=t.target&&t.target.closest&&t.target.closest('.tb');if(b)held.add('#'+b.id)}
  for(const[id,rel]of BTNS){const b=$(id);if(b.classList.contains('on')&&!held.has(id)){b.classList.remove('on');rel()}}}
const tend=e=>{syncBtns(e);for(const t of e.changedTouches){if(TC.mv&&t.identifier===TC.mv.id){TC.mv=null;mvx=mvy=0;js.style.display='none'}if(TC.lk&&t.identifier===TC.lk.id)TC.lk=null}};
document.addEventListener('touchend',tend);document.addEventListener('touchcancel',tend);

/* ---------- запуск ---------- */
try{initGL();makeTextures();makeCube();resize();renderGarage();connect();requestAnimationFrame(frame)}catch(e){fatal('Не удалось запустить игру: '+e.message)}

</script>
</body>
